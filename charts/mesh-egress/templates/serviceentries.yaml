{{- range .Values.egress.hosts }}
---
apiVersion: networking.istio.io/v1
kind: ServiceEntry
metadata:
  name: {{ .name }}
  namespace: {{ $.Values.namespace }}
  {{- if $.Values.egress.useWaypoint }}
  labels:
    istio.io/use-waypoint: waypoint
  {{- end }}
spec:
  hosts:
    - {{ .host | quote }}
  exportTo:
    - "."
  location: MESH_EXTERNAL
  resolution: DNS
  ports:
    - number: {{ .port }}
      name: {{ printf "%s-%v" (lower .protocol) .port }}
      protocol: {{ .protocol }}
{{- end }}
