# Payments team: everything the team writes to join the mesh.
# One file feeds all three charts: mesh-namespace, mesh-routes and mesh-egress.

namespace: payments

# Who may call payments workloads. Everyone else is denied.
allowFrom:
  - namespace: payments
  - namespace: istio-ingress
    serviceAccounts: [public-istio]
  - namespace: orders
    serviceAccounts: [checkout]

ingress:
  allowed: true

routes:
  - name: payments-api
    hostnames: [api.payments.example.com]
    rules:
      - pathPrefix: /
        service: payments-api
        port: 8080

egress:
  hosts:
    - name: payment-provider
      host: api.payment-provider.example
      port: 443
      protocol: TLS
    - name: orders-db
      host: orders-db.example.internal
      port: 5432
      protocol: TCP
